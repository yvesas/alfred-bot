# Dependabot — gratuito também em repositório privado (ao contrário do CodeQL,
# que exige GitHub Advanced Security). Ver specs/project/PLANO-TECNICO.md.
#
# Agrupamos os updates de propósito: um PR por ecossistema por semana em vez de
# um PR por pacote. Ruído semanal é o que faz a gente parar de olhar.
version: 2

updates:
  - package-ecosystem: npm
    directory: /bot
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    # Major de produção vem em PR próprio: quebra de contrato merece leitura.

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /ocr-service
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directories:
      - /bot
      - /web
      - /ocr-service
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(docker)"
