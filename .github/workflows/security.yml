# Varredura de segurança gratuita em repositório PRIVADO.
#
# O CodeQL não entra aqui: em repo privado ele exige GitHub Advanced Security,
# que só vem no plano Team/Enterprise e é cobrado por committer ativo. Quando o
# repositório virar público — ou o plano subir — vale trocar isto pelo CodeQL
# (é uma decisão registrada em specs/project/PLANO-TECNICO.md).
#
# O que dá para fazer de graça: auditar as dependências. É onde mora a maior
# parte do risco real num projeto deste tamanho.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Segunda de manhã: uma CVE publicada no fim de semana aparece antes de virar
    # semana de trabalho.
    - cron: "0 9 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [bot, web]
    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: ${{ matrix.project }}/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Bloqueia em CRÍTICO nas dependências de PRODUÇÃO. Duas escolhas deliberadas:
      #
      # `--prod` porque uma falha no runner de teste não alcança o bot em produção —
      # o vitest não é publicado. Tratá-la como igual faria o gate gritar sempre, e
      # gate que grita sempre é gate que ninguém lê.
      #
      # `critical` e não `high` porque este repositório já nasce com dívida de
      # dependência (ver C22 em specs/codebase/CONCERNS.md): barrar todo PR por causa
      # dela puniria trabalho não relacionado. Crítico em produção, sim, é parar tudo.
      # As altas são acompanhadas pelo Dependabot e pelo passo informativo abaixo.
      - name: Audit de produção (crítico quebra)
        run: pnpm audit --prod --audit-level=critical

      - name: Audit completo (informativo — inclui dev)
        if: always()
        run: pnpm audit || true
